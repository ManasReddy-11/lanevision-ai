# Experiment D1: A with focal BCE (gamma 2, lane weight 0.75) + Dice instead of BCE + Dice.
training:
  experiment_name: D1_focal_dice
  input_size: [320, 160]
  train_mask_dilation: 0
  loss: focal_dice
  focal_gamma: 2.0
  focal_alpha: 0.75
  bce_weight: 0.7
  dice_weight: 0.3
  epochs: 30
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: plateau
  amp: false
  monitor: tusimple_accuracy
  early_stopping: true
  patience: 6
  min_delta: 0.002
  restore_best: true
  evaluate_test: false
  preload: true
  num_workers: 2
  seed: 42
  device: cuda
  production_checkpoint_path: null
